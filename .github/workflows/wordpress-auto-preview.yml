name: Auto-preview approved GitHub article drafts

on:
  push:
    branches: [main]
    paths:
      - "content/wp-manifests/**/*.json"
      - "content/wp-manifests/**/*.html"
      - "content/wp-manifests/**/*.txt"
      - "content/wp-manifests/**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mng-auto-preview
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      manifests: ${{ steps.enumerate.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: enumerate
        name: Select changed post manifests only (never publish)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,glob,os,subprocess
          all_manifests=[]
          for path in glob.glob('content/wp-manifests/**/*.json',recursive=True):
              try:
                  with open(path,encoding='utf-8') as fh:
                      data=json.load(fh)
                  if data.get('kind')=='post' and '/samples/' not in path:
                      all_manifests.append(path)
              except (OSError,ValueError):
                  continue
          if os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch':
              chosen=all_manifests
          else:
              # A single squashed PR may include multiple articles; avoid
              # needlessly rewriting every pre-existing review draft.
              changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
              dirs={p.rsplit('/',1)[0] for p in changed if p.startswith('content/wp-manifests/') and '/' in p}
              chosen=[p for p in all_manifests if p.rsplit('/',1)[0] in dirs]
          print("manifests="+json.dumps(sorted(chosen)[:30],ensure_ascii=False))
          PY

  preview:
    needs: prepare
    if: ${{ needs.prepare.outputs.manifests != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.prepare.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Markdown converter for review articles
        run: python3 -m pip install --disable-pip-version-check markdown==3.7
      - name: Validate and write a private review draft only
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          python3 scripts/wp_build_markdown.py "$MANIFEST"
          python3 scripts/wp_sync.py --mode check --manifest "$MANIFEST"
          python3 scripts/wp_sync.py --mode preview --manifest "$MANIFEST"

  report_failure:
    needs: [prepare, preview]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.preview.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '[WP-AUTO-PREVIEW] Failed run ' + context.runId,
              body: 'Automatic private draft preview failed. No production posts were changed by this workflow.\nRun: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

  report_success:
    needs: [prepare, preview]
    if: ${{ needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify WordPress drafts are non-public
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_draft_reconcile.py > /tmp/mng-preview-reconciliation.json
      - name: Record successful review drafts in GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=fs.readFileSync('/tmp/mng-preview-reconciliation.json','utf8').slice(0,8000);
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:30,
              body:'Auto-preview completed. WordPress draft reconciliation (no public posts changed):\n\n```json\n'+data+'\n```'
            });
