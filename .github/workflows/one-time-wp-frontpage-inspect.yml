name: Inspect WordPress frontpage (read-only)

on:
  push:
    branches: [main]
    paths:
      - scripts/wp_frontpage_inspect.py

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WP frontpage source without writing
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          python3 scripts/wp_frontpage_inspect.py > /tmp/mng-page-structure.json
          cat /tmp/mng-page-structure.json
      - name: Record sanitized findings in GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const details = fs.readFileSync('/tmp/mng-page-structure.json', 'utf8');
            const body = 'Read-only WordPress frontpage structure report. No WP post was changed.\n\n' +
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId +
              '\n\n' + '```json\n' + details + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '[WP-CHECK] TOP音色・予算リンクのREST構造確認',
              body
            });
