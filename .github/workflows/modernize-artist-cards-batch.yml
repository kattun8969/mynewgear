name: Modernize existing artist legacy product cards
on:
  push:
    branches: [main]
    paths: [".github/workflows/modernize-artist-cards-batch.yml"]
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Migrate exact legacy cards without changing historical equipment lists
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY' > /tmp/result.json
          import json, re, html, urllib.request, urllib.error
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup
          from wp_sync import WP, require
          w=WP()
          from collections import Counter
          import unicodedata
          from urllib.parse import urljoin
          def norm(t):
              return unicodedata.normalize("NFKC",t).replace(" ","").lower()
          shop_names={"楽天市場","amazon","yahooショッピング","yahoo!ショッピング","サウンドハウス","楽天","yahoo!","yahoo"}
          image_cache={}
          def image_state(src):
              if src in image_cache: return image_cache[src]
              if len(image_cache)>=40: return "unknown"
              try:
                  u=urlparse(src)
                  if u.scheme!="https" or not u.hostname: return "unknown"
                  # Only direct image requests; never follow affiliate purchase links.
                  with urllib.request.urlopen(urllib.request.Request(src,headers={"User-Agent":"Mozilla/5.0"}),timeout=4) as r:
                      state="ok" if r.headers.get("Content-Type","").lower().startswith("image/") else "broken"
              except urllib.error.HTTPError as e:
                  state="broken" if e.code in (404,410) else "unknown"
              except Exception: state="unknown"
              image_cache[src]=state
              return state
          def migrate(slug):
              p=w.find_post(slug)
              if not p or p.get("status")!="publish": return {"slug":slug,"status":"not_found"}
              raw=p["content"]["raw"]
              token=re.compile(r'<div\b[^>]*>|</div\s*>',re.I)
              stack=[]; spans=[]
              for m in token.finditer(raw):
                  if m.group().lower().startswith("</"):
                      if stack:
                          start,opening=stack.pop()
                          if re.search(r'class\s*=\s*["\'][^"\']*\b(?:kaerebalink-box|booklink-box)\b',opening,re.I):
                              spans.append((start,m.end()))
                  else: stack.append((m.start(),m.group()))
              if not spans: return {"slug":slug,"status":"no_legacy_cards"}
              replacements=[]; report=[]; skipped=[]
              for start,end in sorted(spans):
                  if any(a<=start and end<=b for a,b,_ in replacements): continue
                  old=raw[start:end]
                  soup=BeautifulSoup(old,"html.parser")
                  root=soup.find("div")
                  if not root or "mng-modern-card-v2" in root.get("class",[]): continue
                  anchors=root.find_all("a",href=True)
                  shop=[a for a in anchors if norm(a.get_text(" ",strip=True)) in shop_names]
                  if not shop:
                      skipped.append({"reason":"no_shop_label","classes":sorted({c for e in root.find_all(True) for c in e.get("class",[])})[:25]})
                      continue
                  title=root.select_one(".kaerebalink-name a,.booklink-name a")
                  if not title:
                      title=next((a for a in anchors if a not in shop and a.get_text(" ",strip=True) and "カエレバ" not in a.get_text() and "posted with" not in a.get_text().lower()),None)
                  if not title:
                      skipped.append({"reason":"no_product_title"});continue
                  name=title.get_text(" ",strip=True)
                  original=Counter(a["href"] for a in anchors)
                  root["class"]=root.get("class",[])+["mng-modern-card-v2"]
                  root["style"]="display:flow-root;box-sizing:border-box;max-width:100%;border:1px solid #dce4ec;border-radius:12px;background:#fff;padding:14px;margin:14px 0;overflow-wrap:anywhere"
                  title["style"]="font-size:16px;font-weight:700;color:#173451;text-decoration:none"
                  for a in shop:
                      a["style"]="display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 12px;border-radius:6px;background:#173451;color:white;font-size:13px;font-weight:600;text-decoration:none;margin:4px 4px 4px 0;box-sizing:border-box"
                  for el in root.select(".kaerebalink-link1,.booklink-link2,.booklink-link1"):
                      el["style"]="display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;float:none;width:auto"
                  for el in root.select(".kaerebalink-info,.booklink-info"):
                      el["style"]="min-width:0;overflow-wrap:anywhere"
                  removed=0; checked=0
                  for img in root.find_all("img",src=True):
                      # Affiliate tracking pixels and all anchor destinations are preserved.
                      try: width=int(re.sub(r"[^0-9]","",str(img.get("width","0"))) or 0);height=int(re.sub(r"[^0-9]","",str(img.get("height","0"))) or 0)
                      except ValueError: width=height=0
                      src=img["src"]
                      if width==1 or height==1 or "i.moshimo.com" in (urlparse(src).hostname or ""): continue
                      parent=img.find_parent(class_=re.compile(r"(kaerebalink|booklink)-image"))
                      if not parent and width<50 and height<50: continue
                      checked+=1
                      if image_state(src)=="broken":
                          fallback=soup.new_tag("span");fallback["style"]="display:inline-flex;min-height:75px;width:96px;align-items:center;justify-content:center;background:#f1f4f8;border-radius:6px;color:#66758a;font-size:12px;text-align:center";fallback.string="画像準備中"
                          img.replace_with(fallback);removed+=1
                      else:
                          img["style"]="max-width:120px;width:100%;height:auto;object-fit:contain"
                          img["loading"]="lazy"
                  for el in root.select(".kaerebalink-image,.booklink-image"):
                      el["style"]="float:left;width:105px;max-width:35%;margin:0 14px 10px 0"
                  require(Counter(a["href"] for a in root.find_all("a",href=True))==original,"Affiliate links changed")
                  replacements.append((start,end,str(root)))
                  report.append({"name":name,"shops":len(shop),"images_checked":checked,"broken_images_replaced":removed})
              if not replacements: return {"slug":slug,"status":"no_safe_matches","wrappers":len(spans),"skipped":skipped[:8]}
              new=raw
              for a,b,t in sorted(replacements,reverse=True): new=new[:a]+t+new[b:]
              latest=w.call("GET",f"/posts/{p['id']}",params={"context":"edit"})
              require(latest["content"]["raw"]==raw and latest["slug"]==slug and latest["status"]=="publish","Concurrent edit")
              w.call("POST",f"/posts/{p['id']}",{"content":new})
              check=w.call("GET",f"/posts/{p['id']}",params={"context":"edit"})
              require(check["status"]=="publish" and check["content"]["raw"].count("mng-modern-card-v2")>=new.count("mng-modern-card-v2"),"Verification failed")
              return {"slug":slug,"status":"verified","cards":report,"skipped":skipped[:8]}
          results=[]
          for slug in ["yoasobi-assh","soundmake-king-gnu","soundmake-myhairisbad"]:
              try: results.append(migrate(slug))
              except Exception as e: results.append({"slug":slug,"status":"needs_check","reason":str(e)[:160]})
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:26,body:'Artist product card migration result:\n'+require('fs').readFileSync('/tmp/result.json','utf8')});
