name: BD-2 private review cover and mobile guardrails

on:
  push:
    branches: [main]
    paths:
      - "scripts/wp_bd2_thumbnail.py"
      - "scripts/render_bd2_cover.py"
      - "scripts/render_bd2_drive_comparison.py"
      - "scripts/wp_bd2_full_audit.py"
      - ".github/workflows/wordpress-bd2-thumbnail.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mng-bd2-media-preview
  cancel-in-progress: false

jobs:
  private-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Japanese font and image generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow==11.1.0
      - name: Generate original cover (not a product photograph)
        run: |
          mkdir -p build
          python3 scripts/render_bd2_cover.py build/bd2-cover.png
          python3 scripts/render_bd2_drive_comparison.py build/bd2-drive-comparison.png
      - name: Set featured image on isolated BD-2 review draft
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          python3 scripts/wp_bd2_thumbnail.py > /tmp/mng-bd2-thumbnail-result.json
          cat /tmp/mng-bd2-thumbnail-result.json
      - name: Read-only final HTML/thumbnail QA
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_bd2_full_audit.py > /tmp/mng-bd2-html-audit.json
      - name: Record safe result in tracking issue #13
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const result=fs.readFileSync('/tmp/mng-bd2-thumbnail-result.json','utf8');
            const audit=fs.readFileSync('/tmp/mng-bd2-html-audit.json','utf8');
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:13,
              body:'BD-2 original illustration and draft image result:\n\n```json\n'+result+'\n```\nHTML QA:\n```json\n'+audit+'\n```'
            });

  report-failure:
    needs: [private-cover]
    if: ${{ always() && needs.private-cover.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:13,
              body:'BD-2 featured image did not finish. Public articles unchanged by this workflow. Check failed step: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId
            });
