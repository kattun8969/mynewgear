name: Diagnose WordPress REST draft 403

on:
  push:
    branches: [main]
    paths: [scripts/wp_draft_diagnose.py]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run three private draft size/HTML tests
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          python3 -m py_compile scripts/wp_draft_diagnose.py
          python3 scripts/wp_draft_diagnose.py > /tmp/mng-rest-diagnostic.json
          cat /tmp/mng-rest-diagnostic.json
      - name: Report sanitized diagnostics to issue 30
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=fs.existsSync('/tmp/mng-rest-diagnostic.json') ? fs.readFileSync('/tmp/mng-rest-diagnostic.json','utf8').slice(0,7000) : 'Script failed before saving result';
            await github.rest.issues.createComment({
              owner:context.repo.owner, repo:context.repo.repo, issue_number:30,
              body:'WordPress REST diagnostic (draft-only):\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\n\n```json\n'+data+'\n```'
            });
