name: Reconcile existing WordPress private drafts

on:
  push:
    branches: [main]
    paths: [scripts/wp_draft_reconcile.py]

permissions:
  contents: read
  issues: write

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query private drafts via WP REST GET
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_draft_reconcile.py > /tmp/mng-reconcile.json
      - name: Write reconciliation to GitHub Issue #30
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const result=fs.existsSync('/tmp/mng-reconcile.json')?fs.readFileSync('/tmp/mng-reconcile.json','utf8').slice(0,6500):'Check action run failure logs';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:30,body:'Private draft reconciliation (read-only)\n\n```json\n'+result+'\n```'});
