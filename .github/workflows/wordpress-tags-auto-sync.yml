name: WordPress discovery tags auto-sync

on:
  push:
    branches: [main]
    paths:
      - "content/wp-manifests/taxonomy/discovery-tags.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: mng-wordpress-rest-sync
  cancel-in-progress: false

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag manifest then sync additions to WP
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          python3 scripts/wp_sync.py --mode check --manifest content/wp-manifests/taxonomy/discovery-tags.json
          python3 scripts/wp_sync.py --mode taxonomy --manifest content/wp-manifests/taxonomy/discovery-tags.json

  report_failure:
    needs: taxonomy
    if: ${{ always() && needs.taxonomy.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner:context.repo.owner, repo:context.repo.repo,
              title:'[WP-TAGS] Failed auto-sync run '+context.runId,
              body:'GitHub-to-WordPress taxonomy sync failed. Existing categories/tags/articles were not deliberately deleted.\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId
            });
