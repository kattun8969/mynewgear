name: Audit rendered BD-2 Pochipp preview

on:
  push:
    branches: [main]
    paths: [scripts/wp_bd2_render_audit.py]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read preview rendered HTML, do not print tracked URLs
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_bd2_render_audit.py > /tmp/mng-bd2-render-audit.json
      - name: Report sanitized rendering to Issue 13
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const content=fs.existsSync('/tmp/mng-bd2-render-audit.json')?fs.readFileSync('/tmp/mng-bd2-render-audit.json','utf8').slice(0,3000):'Audit failed; inspect workflow log';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:13,body:'BD-2 private draft rendered Pochipp audit (hosts only, no affiliate URLs):\n\n```json\n'+content+'\n```'});
