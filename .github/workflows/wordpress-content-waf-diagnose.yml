name: Diagnose content-specific WordPress 403

on:
  push:
    branches: [main]
    paths: [scripts/wp_content_waf_diagnose.py]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test private drafts with and without CSS/attributes
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_content_waf_diagnose.py > /tmp/mng-waf-result.json
      - name: Report sanitized result to Issue #30
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=fs.existsSync('/tmp/mng-waf-result.json')?fs.readFileSync('/tmp/mng-waf-result.json','utf8').slice(0,5500):'Diagnostic failed';
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:30,
              body:'Content-specific WAF diagnostic (isolated drafts, no live edits)\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\n\n```json\n'+data+'\n```'
            });
