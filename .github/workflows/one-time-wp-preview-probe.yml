name: One-time WordPress connection probe (draft only)

on:
  push:
    branches:
      - main
    paths:
      - "ops/wordpress-preview-probe.request"

permissions:
  contents: read

concurrency:
  group: mng-one-time-wp-probe
  cancel-in-progress: false

jobs:
  safe-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate sample without credentials
        run: python3 scripts/wp_sync.py --mode check --manifest content/wp-manifests/samples/post-example.json
      - name: Connect to WordPress and create private draft
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: python3 scripts/wp_sync.py --mode preview --manifest content/wp-manifests/samples/post-example.json
