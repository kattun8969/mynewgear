name: Modernize AssH legacy product cards
on:
  push:
    branches: [main]
    paths: [".github/workflows/modernize-assh-cards.yml"]
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Migrate exact legacy cards without changing historical equipment lists
        env:
          WP_SITE_URL: ${{ secrets.MNG_WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.MNG_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.MNG_WP_APP_PASSWORD }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY' > /tmp/result.json
          import json, re, html, urllib.request, urllib.error
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup
          from wp_sync import WP, require
          w=WP()
          p=w.find_post("yoasobi-assh")
          require(p and p.get("status")=="publish","Missing original article")
          raw=p["content"]["raw"]
          # Match balanced HTML div containers, keeping every unrelated byte unchanged.
          token=re.compile(r'<div\b[^>]*>|</div\s*>',re.I)
          stack=[]; spans=[]
          for m in token.finditer(raw):
              if m.group().lower().startswith("</"):
                  if stack:
                      start,opening=stack.pop()
                      if re.search(r'class\s*=\s*["\'][^"\']*\bkaerebalink-box\b',opening,re.I):
                          spans.append((start,m.end()))
              else: stack.append((m.start(),m.group()))
          require(spans,"No legacy card wrappers found; no write")
          known={"tc electronic polytune 3":"チューナー","virtues monica overdrive":"オーバードライブ","suhr eclipse dual channel":"歪み系","vemuram myriad fuzz":"ファズ","xotic ep booster":"ブースター","strymon el capistan":"ディレイ","strymon flint":"リバーブ・トレモロ","strymon ojai r30":"電源","vemuram jan ray":"オーバードライブ"}
          def norm(s): return " ".join(re.sub(r'[^a-z0-9+ ]',' ',s.lower().replace("t.c.electronic","tc electronic")).split())
          candidates=w.call("GET","/pochipps",params={"per_page":100,"context":"edit","status":"publish"})
          products={}
          for q in candidates:
              name=BeautifulSoup(q.get("title",{}).get("rendered",""),"html.parser").get_text()
              key=norm(name)
              if key in products: products[key]=None
              else: products[key]=q["id"]
          replacements=[]; report=[]
          for start,end in sorted(spans):
              # Ignore nested matching containers, if any.
              if any(a<=start and end<=b for a,b,_ in replacements): continue
              old=raw[start:end]
              soup=BeautifulSoup(old,"html.parser")
              title=soup.select_one(".kaerebalink-name a")
              if not title: continue
              name=title.get_text(" ",strip=True)
              key=norm(name)
              if not name: continue
              pid=products.get(key)
              if pid:
                  replacement='\n\n[pochipp id="'+str(pid)+'"]\n\n'
                  report.append({"name":name,"type":"pochipp","id":pid})
              else:
                  # Keep exact existing affiliate hrefs, including tracking pixels; no new IDs.
                  shops=soup.select_one(".kaerebalink-link1")
                  if not shops: continue
                  links=[]
                  for a in shops.find_all("a",href=True):
                      u=urlparse(a["href"])
                      if u.scheme not in ("http","https") or not u.hostname: continue
                      label=a.get_text(" ",strip=True)
                      if not label: continue
                      a["style"]="display:inline-block;padding:9px 13px;border-radius:5px;background:#173451;color:#fff;text-decoration:none;font-weight:600;font-size:13px"
                      a["rel"]="noopener sponsored"
                      # Existing embedded tracking images remain intact.
                      links.append(str(a))
                  if not links: continue
                  picture=soup.select_one(".kaerebalink-image img")
                  image=""
                  if picture:
                      src=picture.get("src","")
                      if urlparse(src).scheme in ("http","https"):
                          try:
                              req=urllib.request.Request(src,headers={"User-Agent":"Mozilla/5.0"})
                              with urllib.request.urlopen(req,timeout=5) as resp:
                                  data=resp.read(64)
                                  ok=resp.headers.get("Content-Type","").startswith("image/") and len(data)>16
                              if ok:
                                  picture["style"]="width:100%;height:110px;object-fit:contain"
                                  picture["loading"]="lazy"
                                  picture["alt"]=name
                                  image=str(picture)
                          except Exception: pass
                  # Retain original generator attribution and existing shop tracking pixels.
                  credit=soup.select_one(".kaerebalink-powered-date")
                  tracking=[]
                  for i in shops.find_all("img"):
                      if not i.find_parent("a"): tracking.append(str(i))
                  fallback='<span style="font-size:12px;color:#66758a">画像準備中</span>'
                  replacement='<div class="mng-legacy-product-card-v1" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1px solid #dce4ec;border-radius:10px;padding:14px;margin:12px 0;background:#fff"><div style="flex:0 0 105px;min-height:90px;display:flex;align-items:center;justify-content:center">'+(image or fallback)+'</div><div style="flex:1 1 185px;min-width:0"><small style="color:#56677a">'+html.escape(known.get(key,"機材"))+'</small><div style="font-size:16px;font-weight:bold;color:#173451;margin:4px 0 9px">'+html.escape(name)+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+''.join(links)+'</div><small>価格・在庫・型番は販売先でご確認ください。</small>'+ (str(credit) if credit else '')+''.join(tracking)+'</div></div>'
                  report.append({"name":name,"type":"legacy_card_preserved","image":bool(image),"shops":len(links)})
              replacements.append((start,end,replacement))
          require(len(replacements)>=8,"Unexpectedly few matches; no write")
          new=raw
          for a,b,s in sorted(replacements,reverse=True): new=new[:a]+s+new[b:]
          latest=w.call("GET",f"/posts/{p['id']}",params={"context":"edit"})
          require(latest["content"]["raw"]==raw and latest["slug"]=="yoasobi-assh","Concurrent edit")
          w.call("POST",f"/posts/{p['id']}",{"content":new})
          check=w.call("GET",f"/posts/{p['id']}",params={"context":"edit"})
          require(check["status"]=="publish" and check["content"]["raw"]==new,"Verification failed")
          print(json.dumps({"post_id":p["id"],"status":"verified","cards":report},ensure_ascii=False,indent=2))
          PY
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:26,body:'AssH product card migration result:\n'+require('fs').readFileSync('/tmp/result.json','utf8')});
